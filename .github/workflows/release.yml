name: Release APK

# Pushing a tag such as v1.26.3.1 builds the APK from that commit and publishes it as a GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      # libltw.so (the OpenLTW renderer) is built from source at a pinned commit, see scripts/build-ltw.sh
      - name: Build libltw.so
        run: ./scripts/build-ltw.sh

      - name: Build APK
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/Minecraft-Java-Edition-1.26.3.1.apk
          md5sum out/Minecraft-Java-Edition-1.26.3.1.apk > out/Minecraft-Java-Edition-1.26.3.1.md5

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APK=out/Minecraft-Java-Edition-1.26.3.1.apk
          MD5=out/Minecraft-Java-Edition-1.26.3.1.md5
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A release for this tag was already created on GitHub, so only attach the files.
            gh release upload "$GITHUB_REF_NAME" "$APK" "$MD5" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$MD5" \
              --verify-tag \
              --title "Minecraft Java Edition 1.26.3.1" \
              --notes "Unofficial build by voiz inc. Not affiliated with Mojang or Microsoft. Built from commit $GITHUB_SHA"
          fi
