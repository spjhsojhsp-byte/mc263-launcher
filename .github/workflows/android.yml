name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # The Java 25 runtime for this build is committed under
      # app_pojavlauncher/src/main/assets/components/jre-25, so nothing is downloaded here.

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen md5sums
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.*

      # One "debug-latest" pre-release always holds the newest APK built from main.
      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest out/app-debug.apk out/app-debug.md5 \
            --target "$GITHUB_SHA" \
            --title "Debug build (latest)" \
            --notes "Built from commit $GITHUB_SHA" \
            --prerelease
